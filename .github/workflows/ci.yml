name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: platform_agent
          POSTGRES_USER: platform_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_agent -d platform_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PLATFORM_PROFILE: local
      PLATFORM_RUNTIME_ROLE: migration
      ORCHESTRATOR_DATABASE_URL: postgresql+psycopg://platform_agent@127.0.0.1:5432/platform_agent
      CHECKPOINT_DATABASE_URL: postgresql://platform_agent@127.0.0.1:5432/platform_agent_checkpoints
      TEST_POSTGRES_URL: postgresql+psycopg://platform_agent@127.0.0.1:5432/platform_agent
      TEST_CHECKPOINT_POSTGRES_URL: postgresql://platform_agent@127.0.0.1:5432/platform_agent_checkpoints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m deploy.bootstrap_databases
      - run: python -m deploy.app_migrate
      - run: python -c "from platform_agent_orchestrator.runtime import checkpoint_migrate_main; checkpoint_migrate_main()"
      - run: python -m pytest

  image-and-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/generate_secrets.py
      - run: docker compose config --quiet
      - run: docker compose build --build-arg SOURCE_REVISION="$GITHUB_SHA"
      - run: docker compose up --detach --wait api worker
      - run: PYTHONPATH=src python deploy/smoke.py
      - run: docker compose kill --signal SIGTERM worker
      - run: docker compose up --detach --wait worker
      - run: PYTHONPATH=src python deploy/smoke.py
      - if: always()
        run: docker compose down --volumes
