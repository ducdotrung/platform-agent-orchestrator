name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest

  image-and-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/generate_secrets.py
      - run: docker compose config --quiet
      - run: docker compose build --build-arg SOURCE_REVISION="$GITHUB_SHA"
      - run: docker compose up --detach --wait api worker
      - run: PYTHONPATH=src python deploy/smoke.py
      - run: docker compose kill --signal SIGTERM worker
      - run: docker compose up --detach --wait worker
      - run: PYTHONPATH=src python deploy/smoke.py
      - if: always()
        run: docker compose down --volumes
