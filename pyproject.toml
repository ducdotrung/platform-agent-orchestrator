[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "platform-agent-orchestrator"
version = "0.1.0"
description = "Reference LangGraph control plane for platform engineering agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<2.0",
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "prometheus-client>=0.21,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
observability = [
  "langfuse>=4.0,<5.0",
]
dev = [
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
platform-agent = "platform_agent_orchestrator.cli:main"
platform-agent-worker = "platform_agent_orchestrator.runtime:worker_main"
platform-agent-checkpoint-migrate = "platform_agent_orchestrator.runtime:checkpoint_migrate_main"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
