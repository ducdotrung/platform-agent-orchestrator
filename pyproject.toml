[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "platform-agent-orchestrator"
version = "0.1.0"
description = "Reference LangGraph control plane for platform engineering agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
observability = [
  "langfuse>=4.0,<5.0",
]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
platform-agent = "platform_agent_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
